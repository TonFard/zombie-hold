<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>爆发后的便利店 · Post-Outbreak Konbini</title>
    <style>
      :root { color-scheme: dark; font-family: 'Yu Gothic UI', 'Microsoft YaHei', sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111722; color: #e7edf4; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #bar { position: fixed; right: 20px; bottom: 18px; display: flex; gap: 8px; padding: 7px; border: 1px solid #64708055; border-radius: 30px; background: #0b1019dd; box-shadow: 0 8px 32px #0008; }
      button { border: 1px solid transparent; border-radius: 22px; padding: 10px 17px; background: transparent; color: #adb8c8; font: inherit; cursor: pointer; }
      button:hover { color: white; background: #ffffff12; }
      button.active { color: #e9f1ff; border-color: #7588a088; background: #29384b; }
      #title { position: fixed; left: 22px; top: 18px; font-size: 14px; letter-spacing: .1em; color: #d6dfeb; text-shadow: 0 2px 8px #000; pointer-events: none; }
      #sub { display:block; margin-top:5px; font-size:11px; letter-spacing:.04em; color:#8995a7; }
      #hint { position:fixed; left:22px; bottom:20px; font-size:12px; color:#aeb9c8; text-shadow:0 1px 5px #000; pointer-events:none; }
      #status { position:fixed; left:50%; top:18px; transform:translateX(-50%); padding:8px 14px; border-radius:6px; color:#e8d6b5; background:#141923c9; font-size:13px; }
      #status:empty { display:none; }
      @media(max-width:600px) { #bar { right:10px; bottom:10px; gap:0; } button { padding:9px 12px; font-size:13px; } #hint { bottom:78px; left:12px; } #title { left:12px; top:12px; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="title">爆发后的便利店<span id="sub">POST-OUTBREAK · DRAG TO ORBIT · SCROLL TO ZOOM</span></div>
    <div id="status">正在载入爆发后场景…</div>
    <div id="hint">拖动旋转 · 滚轮缩放 · 点击推拉门可开合</div>
    <div id="bar">
      <button id="light" class="active" type="button">灯光</button>
      <button id="white" type="button">白模</button>
      <button id="door" type="button">开门</button>
      <button id="spin" type="button">自动旋转</button>
    </div>
    <script type="module" src="/src/konbini/postOutbreakPreview.ts"></script>
  </body>
</html>
